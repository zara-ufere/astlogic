[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astlogic"
version = "0.1.0"
description = "Check the structure of Python code with Prolog rubrics, without running the code"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
astlogic = "astlogic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astlogic = ["prolog/*.pl", "prolog/rubrics/*.pl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
